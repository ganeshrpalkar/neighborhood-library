name: CI

on:
  pull_request:
    branches: [main, staging, production]
  push:
    branches-ignore: [main, staging, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Lint: ruff + mypy — blocks CI on failure
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check app/ tests/

      - name: Mypy type check
        run: uv run mypy app/ --ignore-missing-imports

  # ─────────────────────────────────────────────────────────────
  # Unit + property tests — no external services, fast
  # ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit & Property Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short -q
        env:
          PYTHONPATH: .

      - name: Run property tests (Hypothesis)
        run: uv run pytest tests/properties/ -v --tb=short -q
        env:
          PYTHONPATH: .

      - name: Run smoke tests (app startup, no DB)
        run: uv run pytest tests/test_startup_smoke.py -v --tb=short
        env:
          PYTHONPATH: .
          ENVIRONMENT: local

  # ─────────────────────────────────────────────────────────────
  # Contract tests — in-process ASGI against live MongoDB + Redis
  # ─────────────────────────────────────────────────────────────
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run contract tests
        run: |
          uv run pytest tests/test_health.py tests/contract/ \
            -m "contract and not mutation" \
            -v --tb=short -q
        env:
          PYTHONPATH: .
          ENVIRONMENT: local
          MONGO_ENDPOINT: mongodb://localhost:27017
          MONGO_DB: app-test
          REDIS_URL: redis://localhost:6379/15
          REDIS_KEY_PREFIX: app-test
          JWT_SECRET_KEY: ci-test-secret-key

  # ─────────────────────────────────────────────────────────────
  # Docker build check — validates Dockerfiles build (no push)
  # ─────────────────────────────────────────────────────────────
  docker-build-check:
    name: Docker Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile
            context: .
          - name: celery-worker
            dockerfile: Dockerfile.worker
            context: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} (no push)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
