[project]
name = "fastapi-app"
version = "1.0.0"
description = "Neighborhood Library Service — FastAPI REST API with PostgreSQL, Redis, Celery, JWT auth"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn==20.1.0",
    "anyio>=4.0.0",

    # Validation & settings
    "pydantic[email]>=2.12.0",
    "pydantic-settings>=2.0.0",

    # Database
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "redis>=6.0.0",

    # Background tasks
    "celery>=5.5.0",
    "kombu>=5.0.0",

    # Auth (HS256 JWT + password hashing)
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",

    # HTTP client (for health checks / webhooks)
    "httpx>=0.28.0",

    # Multipart form parsing (cover image uploads)
    "python-multipart>=0.0.9",

    # Rate limiting
    "slowapi>=0.1.9",

    # Metrics
    "prometheus-fastapi-instrumentator>=6.0.0",

    # Structured logging
    "python-json-logger>=3.3.0",
    "json-log-formatter>=1.0",

    # CLI
    "typer>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.28.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-redis>=4.6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "contract: requires live PostgreSQL + Redis",
    "mutation: creates or deletes data in the test DB",
    "property: Hypothesis property-based tests",
]

[tool.hypothesis]
max_examples = 100

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
